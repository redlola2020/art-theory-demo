<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>艺术概论 · 实验性课堂 Demo</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&display=swap');
:root{--bg:#111318;--fg:#ecebe7;--muted:#9a9da6;--line:rgba(236,235,231,.16);--accent:#d7ff62}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;font-weight:300}button{font:inherit;color:inherit}
#app{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 50% 48%,#20242b 0,#15171c 38%,#0d0f13 100%)}
.noise{position:absolute;inset:0;opacity:.06;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.55'/%3E%3C/svg%3E")}
.top{position:absolute;left:34px;right:34px;top:28px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:12px;letter-spacing:.22em;color:#b8bbc2}.mark{width:9px;height:9px;border:1px solid var(--accent);border-radius:50%;display:inline-block;margin-right:9px;box-shadow:0 0 15px rgba(215,255,98,.55)}
.scene{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;transform:scale(1.015);transition:opacity .8s ease,transform 1s ease}.scene.active{opacity:1;pointer-events:auto;transform:scale(1)}
.center{text-align:center;position:relative;z-index:2}.eyebrow{font-size:11px;letter-spacing:.42em;color:var(--muted);margin-bottom:24px}.title{font-size:clamp(34px,6vw,78px);letter-spacing:.18em;font-weight:300;margin:0 0 18px}.sub{font-size:13px;color:#aeb0b8;letter-spacing:.16em}
.start{margin-top:50px;border:1px solid rgba(236,235,231,.35);background:transparent;padding:13px 40px;letter-spacing:.4em;font-size:14px;cursor:pointer;transition:.35s}.start:hover{border-color:var(--accent);color:var(--accent);box-shadow:0 0 30px rgba(215,255,98,.1);transform:translateY(-2px)}
canvas{position:absolute;inset:0;width:100%;height:100%}.progress{position:absolute;bottom:34px;left:34px;right:34px;display:flex;align-items:center;gap:16px;color:#777b84;font-size:10px;letter-spacing:.2em}.bar{height:1px;background:var(--line);flex:1}.bar i{display:block;width:0;height:1px;background:var(--accent);transition:width .7s ease}
.question{max-width:850px;padding:40px}.question h2{font-size:clamp(28px,4vw,54px);font-weight:300;line-height:1.35;letter-spacing:.05em;margin:0 0 42px}.options{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:12px}.opt{position:relative;text-align:left;padding:20px 22px;border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;transition:.3s}.opt span{display:block;font-size:11px;color:#777b84;margin-bottom:10px}.opt:hover{border-color:#777c88;background:rgba(255,255,255,.06)}.opt.selected{border-color:var(--accent);background:rgba(215,255,98,.06)}.opt.selected:after{content:'✓';position:absolute;right:18px;top:18px;color:var(--accent)}
.result .ring{width:190px;height:190px;border:1px solid rgba(215,255,98,.5);border-radius:50%;display:grid;place-items:center;margin:0 auto 34px;position:relative;box-shadow:0 0 80px rgba(215,255,98,.07)}.ring:before,.ring:after{content:'';position:absolute;border:1px solid rgba(236,235,231,.12);border-radius:50%}.ring:before{inset:18px}.ring:after{inset:-10px;border-style:dashed;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.result .big{font-size:52px;font-weight:300}.result p{color:#aeb0b8;letter-spacing:.16em;font-size:12px}
.hint{position:absolute;right:34px;bottom:34px;color:#666a73;font-size:10px;letter-spacing:.12em}.skip{position:absolute;right:34px;top:28px;border:0;background:none;color:#666a73;font-size:11px;cursor:pointer;letter-spacing:.15em}.skip:hover{color:#eee}
@media(max-width:650px){.options{grid-template-columns:1fr}.top{left:20px;right:20px}.progress{left:20px;right:20px}.title{font-size:34px}.question{padding:25px}}
</style>
</head>
<body>
<div id="app"><div class="noise"></div>
<div class="top"><div><i class="mark"></i>ART THEORY / 01</div><div id="clock">00:00</div></div>
<section class="scene active" id="s0"><div class="center"><div class="eyebrow">INTERACTIVE LECTURE / EXPERIMENT 01</div><h1 class="title">艺术概论</h1><div class="sub">先提出问题，再寻找答案</div><button class="start" id="start">开始</button></div></section>
<section class="scene" id="s1"><canvas id="particles"></canvas><div class="center"><div class="eyebrow">QUESTION / 01</div><h1 class="title" style="font-size:clamp(30px,5vw,64px)">什么是艺术？</h1><div class="sub">不要急着回答 · 让问题先停留三秒</div></div></section>
<section class="scene" id="s2"><div class="center"><div class="eyebrow">ART THEORY</div><h1 class="title">艺术不是答案</h1><div class="sub">它首先是一种被提出的问题</div><button class="start" id="toVote">进入课堂实验</button></div></section>
<section class="scene" id="s3"><div class="question"><div class="eyebrow">LIVE POLL / 01</div><h2>如果一件作品让你产生了强烈感受，<br>它就一定是艺术吗？</h2><div class="options"><button class="opt"><span>A / 判断</span>是，因为艺术首先是一种体验</button><button class="opt"><span>B / 判断</span>不一定，感受并不能定义艺术</button><button class="opt"><span>C / 判断</span>要看它所处的语境</button><button class="opt"><span>D / 判断</span>我暂时无法判断</button></div></div><div class="hint">点击一个选项 · 真实课堂中这里可以接扫码投票</div></section>
<section class="scene result" id="s4"><div class="center"><div class="ring"><div class="big" id="score">01</div></div><div class="eyebrow">YOUR POSITION</div><h1 class="title" style="font-size:clamp(28px,4vw,50px)">答案正在形成</h1><p>下一步：把观点带进历史、理论与作品</p><button class="start" id="again">重新体验</button></div></section>
<div class="progress"><span id="page">01 / 05</span><div class="bar"><i id="fill"></i></div><span>ART THEORY</span></div>
</div>
<script>
const scenes=[...document.querySelectorAll('.scene')];let current=0,selected=false;const fill=document.querySelector('#fill'),page=document.querySelector('#page');
function go(n){scenes[current].classList.remove('active');current=n;scenes[current].classList.add('active');page.textContent=String(current+1).padStart(2,'0')+' / 05';fill.style.width=(current/4*100)+'%';if(current===1)startParticles();}
document.querySelector('#start').onclick=()=>go(1);document.querySelector('#toVote').onclick=()=>go(3);document.querySelector('#again').onclick=()=>{selected=false;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));go(0)};
document.querySelectorAll('.opt').forEach((b,i)=>b.onclick=()=>{if(selected)return;selected=true;b.classList.add('selected');document.querySelector('#score').textContent=String(i+1).padStart(2,'0');setTimeout(()=>go(4),650)});
let t=0;setInterval(()=>{t++;document.querySelector('#clock').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')},1000);
const c=document.querySelector('#particles'),ctx=c.getContext('2d');let ps=[],raf;function resize(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function startParticles(){ps=[];for(let i=0;i<180;i++){let a=Math.random()*Math.PI*2,r=120+Math.random()*Math.min(innerWidth,innerHeight)*.32;ps.push({x:innerWidth/2+Math.cos(a)*r,y:innerHeight/2+Math.sin(a)*r,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,s:.5+Math.random()*1.5,tx:innerWidth/2+(Math.random()-.5)*230,ty:innerHeight/2+(Math.random()-.5)*110,p:0})}cancelAnimationFrame(raf);animate()}function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.p=Math.min(1,p.p+.006);let ease=p.p*p.p*(3-2*p.p);p.x+=(p.tx-p.x)*.0025+p.vx;p.y+=(p.ty-p.y)*.0025+p.vy;let alpha=.25+.45*Math.sin(p.p*Math.PI);ctx.globalAlpha=alpha;ctx.fillStyle='#dfe4d0';ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;raf=requestAnimationFrame(animate)}
</script>
</body></html>
